<svg width="100%" viewBox="0 0 680 720" xmlns="http://www.w3.org/2000/svg">
<style>
  svg { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
  .arr { stroke: #888780; stroke-width: 1.5; }

  /* Color ramp fills and strokes */
  .c-gray > rect { fill: #F1EFE8; stroke: #5F5E5A; }
  .c-gray > text.th { fill: #2C2C2A; }
  .c-gray > text.ts { fill: #5F5E5A; }

  .c-blue > rect { fill: #E6F1FB; stroke: #185FA5; }
  .c-blue > text.th { fill: #0C447C; }
  .c-blue > text.ts { fill: #185FA5; }

  .c-purple > rect { fill: #EEEDFE; stroke: #534AB7; }
  .c-purple > text.th { fill: #3C3489; }
  .c-purple > text.ts { fill: #534AB7; }

  .c-teal > rect { fill: #E1F5EE; stroke: #0F6E56; }
  .c-teal > text.th { fill: #085041; }
  .c-teal > text.ts { fill: #0F6E56; }

  .c-amber > rect { fill: #FAEEDA; stroke: #854F0B; }
  .c-amber > text.th { fill: #633806; }
  .c-amber > text.ts { fill: #854F0B; }

  .c-coral > rect { fill: #FAECE7; stroke: #993C1D; }
  .c-coral > text.th { fill: #712B13; }
  .c-coral > text.ts { fill: #993C1D; }

  .c-pink > rect { fill: #FBEAF0; stroke: #993556; }
  .c-pink > text.th { fill: #72243E; }
  .c-pink > text.ts { fill: #993556; }

  .c-green > rect { fill: #EAF3DE; stroke: #3B6D11; }
  .c-green > text.th { fill: #27500A; }
  .c-green > text.ts { fill: #3B6D11; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text class="th" x="340" y="28" text-anchor="middle" fill="#2C2C2A">Crossy Road FPGA — module hierarchy</text>
<text class="ts" x="340" y="46" text-anchor="middle">Nexys 4DDR, 3 clock domains, 15+ modules</text>

<!-- game_top container -->
<g class="c-gray">
<rect x="40" y="64" width="600" height="640" rx="20" stroke-width="0.5"/>
<text class="th" x="60" y="88">game_top</text>
<text class="ts" x="60" y="106">FSM, physics, scoring, integration</text>
</g>

<!-- Clock infrastructure -->
<g class="c-blue">
<rect x="70" y="124" width="130" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="135" y="146" text-anchor="middle">clk_wiz_0</text>
<text class="ts" x="135" y="163" text-anchor="middle">100→106.47 MHz</text>
</g>

<g class="c-blue">
<rect x="220" y="124" width="130" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="285" y="146" text-anchor="middle">clk_divider</text>
<text class="ts" x="285" y="163" text-anchor="middle">100 MHz → 60 Hz</text>
</g>

<line x1="200" y1="152" x2="218" y2="152" class="arr" marker-end="url(#arrow)"/>

<!-- VGA module -->
<g class="c-purple">
<rect x="380" y="124" width="240" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="500" y="146" text-anchor="middle">vga</text>
<text class="ts" x="500" y="163" text-anchor="middle">hsync, vsync, curr_x, curr_y</text>
</g>

<line stroke="#534AB7" stroke-width="1" x1="350" y1="152" x2="378" y2="152" marker-end="url(#arrow)" fill="none"/>
<text class="ts" x="364" y="144">pixclk</text>

<!-- drawcon container -->
<g class="c-teal">
<rect x="70" y="210" width="550" height="190" rx="14" stroke-width="0.5"/>
<text class="th" x="90" y="234">drawcon (pixel rendering engine)</text>
<text class="ts" x="90" y="252">Priority mux: info bar → chicken → obstacles → lane bg</text>
</g>

<g class="c-amber">
<rect x="90" y="270" width="100" height="44" rx="6" stroke-width="0.5"/>
<text class="th" x="140" y="296" text-anchor="middle">info_bar</text>
</g>
<g class="c-amber">
<rect x="200" y="270" width="100" height="44" rx="6" stroke-width="0.5"/>
<text class="th" x="250" y="296" text-anchor="middle">sprite ROMs</text>
</g>
<g class="c-amber">
<rect x="310" y="270" width="115" height="44" rx="6" stroke-width="0.5"/>
<text class="th" x="367" y="296" text-anchor="middle">lane renderer</text>
</g>
<g class="c-amber">
<rect x="435" y="270" width="100" height="44" rx="6" stroke-width="0.5"/>
<text class="th" x="485" y="296" text-anchor="middle">font ROM</text>
</g>

<text class="ts" x="90" y="340" fill="#085041">BRAM IPs: chicken (×4 frames), car (×2), truck, log, fox (×2), title, digits</text>
<text class="ts" x="90" y="358" fill="#085041">12-bit RGB per pixel, COE files, transparency key = 000</text>
<text class="ts" x="90" y="376" fill="#085041">Combinational logic on pixclk domain</text>

<!-- VGA ↔ drawcon arrows -->
<line stroke="#0F6E56" stroke-width="1" x1="500" y1="180" x2="500" y2="208" marker-end="url(#arrow)" fill="none"/>
<text class="ts" x="516" y="198">curr_x/y</text>

<line stroke="#0F6E56" stroke-width="1" x1="420" y1="208" x2="420" y2="180" marker-end="url(#arrow)" fill="none"/>
<text class="ts" x="436" y="198">RGB</text>

<!-- Game logic tier -->
<g class="c-coral">
<rect x="70" y="430" width="160" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="150" y="452" text-anchor="middle">player_ctrl</text>
<text class="ts" x="150" y="469" text-anchor="middle">Movement + bounds</text>
</g>

<g class="c-coral">
<rect x="250" y="430" width="160" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="330" y="452" text-anchor="middle">lane_manager</text>
<text class="ts" x="330" y="469" text-anchor="middle">LFSR + scrolling</text>
</g>

<g class="c-coral">
<rect x="430" y="430" width="180" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="520" y="452" text-anchor="middle">collision_engine</text>
<text class="ts" x="520" y="469" text-anchor="middle">AABB per lane</text>
</g>

<line stroke="#993C1D" stroke-width="0.8" x1="150" y1="400" x2="150" y2="428" marker-end="url(#arrow)" fill="none"/>
<line stroke="#993C1D" stroke-width="0.8" x1="330" y1="400" x2="330" y2="428" marker-end="url(#arrow)" fill="none"/>
<line stroke="#993C1D" stroke-width="0.8" x1="520" y1="400" x2="520" y2="428" marker-end="url(#arrow)" fill="none"/>

<line stroke="#993C1D" stroke-width="0.8" x1="230" y1="458" x2="248" y2="458" marker-end="url(#arrow)" fill="none"/>
<line stroke="#993C1D" stroke-width="0.8" x1="410" y1="458" x2="428" y2="458" marker-end="url(#arrow)" fill="none"/>

<!-- Peripheral tier -->
<g class="c-pink">
<rect x="70" y="520" width="120" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="130" y="542" text-anchor="middle">debounce ×5</text>
<text class="ts" x="130" y="559" text-anchor="middle">10 ms filter</text>
</g>

<g class="c-pink">
<rect x="210" y="520" width="140" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="280" y="542" text-anchor="middle">accelerometer</text>
<text class="ts" x="280" y="559" text-anchor="middle">SPI / ADXL362</text>
</g>

<g class="c-pink">
<rect x="370" y="520" width="130" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="435" y="542" text-anchor="middle">mic_detector</text>
<text class="ts" x="435" y="559" text-anchor="middle">PDM → volume</text>
</g>

<g class="c-pink">
<rect x="520" y="520" width="100" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="570" y="542" text-anchor="middle">pwm_audio</text>
<text class="ts" x="570" y="559" text-anchor="middle">Sound FX</text>
</g>

<line stroke="#993556" stroke-width="0.8" x1="130" y1="486" x2="130" y2="518" marker-end="url(#arrow)" fill="none"/>
<line stroke="#993556" stroke-width="0.8" x1="280" y1="486" x2="280" y2="518" marker-end="url(#arrow)" fill="none"/>

<!-- Output tier -->
<g class="c-green">
<rect x="70" y="610" width="180" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="160" y="632" text-anchor="middle">score_display</text>
<text class="ts" x="160" y="649" text-anchor="middle">7-seg mux (8 digits)</text>
</g>

<g class="c-green">
<rect x="270" y="610" width="180" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="360" y="632" text-anchor="middle">LED controller</text>
<text class="ts" x="360" y="649" text-anchor="middle">Score bar + status</text>
</g>

<line stroke="#3B6D11" stroke-width="0.8" x1="160" y1="576" x2="160" y2="608" marker-end="url(#arrow)" fill="none"/>

<!-- Legend -->
<text class="ts" x="340" y="700" text-anchor="middle" fill="#5F5E5A" font-style="italic">Purple = pixclk (106.47 MHz)  |  Coral = game_clk (60 Hz)  |  Pink = sys_clk (100 MHz)</text>
</svg>